name: publication-results

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate-publication-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -r requirements.txt

      - name: Generate publication figures from authoritative CSVs
        run: python scripts/generate_publication_figures.py

      - name: Validate publication result sources
        run: python scripts/validate_publication_results.py

      - name: Sync generated publication figures
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/figure_fixed_target_history.png results/figure_fixed_target_history.svg results/figure_signed_domain_speedup.png results/figure_signed_domain_speedup.svg
          if git diff --cached --quiet; then
            echo "No publication figure changes to commit."
            exit 0
          fi
          git commit -m "Sync authoritative publication figures [skip ci]"
          git push origin "HEAD:${BRANCH}"
