name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -r requirements.txt

      - name: Run experiment
        run: python run_all.py

      - name: Run stopping-rule confound experiment
        run: python experiments/stopping_rule_confound.py

      - name: Run squares relatedness experiment
        run: python experiments/squares_relatedness.py

      - name: Run compatibility calibration
        run: python experiments/compatibility_calibration.py

      - name: Run relatedness pairs experiment
        run: python experiments/relatedness_pairs.py

      - name: Run skill-isolation invariant check (retention)
        run: python experiments/retention.py

      - name: Run signed-domain transfer-robustness experiment
        run: python experiments/signed_domain_transfer.py

      - name: Run unrelated-parent transfer control
        run: python experiments/unrelated_parent_control.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Print summary
        run: python src/print_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Sync generated results into repository
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No generated result changes to commit."
            exit 0
          fi
          git commit -m "Sync workflow-generated experiment results [skip ci]"
          git push origin "HEAD:${BRANCH}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: results/
          retention-days: 90
