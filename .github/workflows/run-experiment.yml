name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -r requirements.txt

      - name: Run experiment
        run: python run_all.py

      - name: Run stopping-rule confound experiment
        run: python experiments/stopping_rule_confound.py

      - name: Run squares relatedness experiment
        run: python experiments/squares_relatedness.py

      - name: Print summary
        run: python src/print_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: results/
          retention-days: 90
